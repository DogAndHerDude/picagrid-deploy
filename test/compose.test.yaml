# Runs the production compose on one machine: real images, HTTPS and subdomains, on picagrid.localhost.
# Certificates can't be issued there, so Traefik falls back to its own, which a browser has to be told to accept.
# Google and Microsoft are stood in for by a mock, and Mailpit catches the mail.
services:
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.4
    environment:
      SERVER_PORT: 8090
      JSON_CONFIG: '{"interactiveLogin": true}'
    networks:
      default:
        aliases:
          - mock.picagrid.localhost
    ports:
      - "127.0.0.1:8090:8090"
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:8025:8025"
